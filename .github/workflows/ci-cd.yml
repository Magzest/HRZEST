name: Total Automation CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hrms-prod-repo
  ECS_CLUSTER: hrms-prod-cluster
  ECS_SERVICE: hrms-prod-service
  APP_TASK_DEF_FILE: TaskDefinition.json

jobs:
  # ---------------------------------------------------------
  # Phase 1: Lint, Security & Unit Testing
  # ---------------------------------------------------------
  security-and-test:
    name: Code Quality & Security Scanning
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_testpass
          POSTGRES_DB: att_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d att_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir dlib-bin
          pip install --no-cache-dir --no-deps face-recognition face-recognition-models
          grep -v '^face-recognition' requirements.txt > /tmp/ci-requirements.txt
          pip install --no-cache-dir -r /tmp/ci-requirements.txt -r requirements-dev.txt

      - name: Run Pytest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: ci_testpass
          DB_NAME: att_test
          SECRET_KEY: ci-test-secret-key
          FLASK_ENV: testing
        run: python -m pytest tests/ -v

      - name: SAST Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      - name: Dependency Scan (Snyk)
        uses: snyk/actions/python-3.10@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

  # ---------------------------------------------------------
  # Phase 2: Docker Build & ECR Push
  # ---------------------------------------------------------
  build-and-push:
    name: Build & Push to ECR
    needs: security-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
          docker push -a $ECR_REGISTRY/$ECR_REPOSITORY
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------
  # Phase 3: ECS Deployment
  # ---------------------------------------------------------
  # No separate migration step here: there is no Flask-Migrate/Alembic in
  # this codebase (no migrations/ dir, no `flask db` CLI registered), so a
  # standalone `flask db upgrade` ECS task always failed and always blocked
  # every deploy at this stage. Schema migrations for every tenant already
  # run automatically at application boot -- see wsgi.py's
  # _run_migrations_for_all_tenants() call and app.py's ~20 idempotent
  # migration phases -- so the new task definition's own container startup
  # (triggered by the ECS service update below) applies them with no
  # separate orchestration needed.
  deploy:
    name: ECS Update
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render new ECS Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.APP_TASK_DEF_FILE }}
          container-name: app-container
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to Amazon ECS (Zero-Downtime Rolling Update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
