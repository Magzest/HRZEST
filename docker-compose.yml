version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgrespassword
      DB_NAME: postgres
      SIGNUP_SECRET: enterprise_secret_2026
      MANDATORY_LOGIN_MFA: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
