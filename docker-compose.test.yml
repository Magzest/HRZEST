version: '3.8'

# Lightweight, test-only Postgres — mirrors .github/workflows/ci-cd.yml's
# postgres service exactly (same image, db name, user, password, healthcheck)
# so "passes locally" reliably means "passes in CI". Separate from
# docker-compose.yml, which runs the full app stack for manual dev use and
# defaults its postgres service's DB_NAME to "postgres", not "att_test".
services:
  postgres-test:
    image: postgres:16
    container_name: attendance_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_testpass
      POSTGRES_DB: att_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d att_test"]
      interval: 10s
      timeout: 5s
      retries: 10
