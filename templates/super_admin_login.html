<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform Admin — SaaS Operator Console</title>
    <link rel="stylesheet" href="{{ static_url('shared.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('tabler-icons.min.css') }}" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      body {
        min-height: 100vh;
        background: radial-gradient(circle at 50% 20%, #0f172a, #020617);
        color: #f8fafc;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; position: relative; overflow: hidden;
      }
      .glow-orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.25; pointer-events: none; }
      .orb1 { width: 450px; height: 450px; background: #6366f1; top: -100px; left: -100px; }
      .orb2 { width: 400px; height: 400px; background: #3b82f6; bottom: -100px; right: -100px; }
      .card {
        width: 100%; max-width: 440px;
        background: rgba(15, 23, 42, 0.85);
        -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 24px; padding: 40px 36px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
      }
      .logo-hdr { text-align: center; margin-bottom: 30px; }
      .shield-icon {
        width: 72px; height: 72px;
        background: linear-gradient(135deg, #4338ca, #6366f1);
        border-radius: 22px; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 36px; color: #fff;
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
      }
      .field-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.6px; }
      .field-input {
        width: 100%; padding: 14px 16px;
        background: #090d16; border: 1.5px solid #1e293b;
        border-radius: 12px; color: #f8fafc; font-size: 15px; outline: none; transition: 0.2s; margin-bottom: 20px;
      }
      .field-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
      .btn-cyber {
        width: 100%; padding: 15px; border: none; border-radius: 12px;
        background: linear-gradient(135deg, #4f46e5, #4338ca);
        color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      .btn-cyber:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(79, 70, 229, 0.6); }
      .error-box {
        background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5; border-radius: 10px; padding: 12px 16px; font-size: 13px; font-weight: 600; margin-bottom: 20px;
        display: flex; align-items: center; gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <div class="card">
      <div class="logo-hdr">
        <div class="shield-icon"><i class="ti ti-building-fortress"></i></div>
        <h1 style="font-size: 22px; font-weight: 800;">Platform Admin</h1>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 4px;">SaaS Operator Console — every tenant, one place</p>
      </div>

      {% if error %}
      <div class="error-box"><i class="ti ti-alert-circle"></i> {{ error }}</div>
      {% endif %}

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="error-box"><i class="ti ti-alert-circle"></i> {{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form action="/super_admin/login" method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
        <label class="field-label">Username</label>
        <input class="field-input" type="text" name="username" required autofocus autocomplete="username" />

        <label class="field-label">Password</label>
        <input class="field-input" type="password" name="password" required autocomplete="current-password" />

        <button type="submit" class="btn-cyber"><i class="ti ti-lock"></i> Sign In</button>
      </form>

      <div style="margin-top: 20px; text-align: center; font-size: 12px;">
        <a href="/login" style="color: #64748b; text-decoration: none;">← Return to Standard Admin Portal</a>
      </div>
    </div>
  </body>
</html>
