<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Identity</title>
    <link rel="stylesheet" href="{{ static_url('shared.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('tabler-icons.min.css') }}" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
      body {
        min-height: 100vh;
        background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%);
        color: #1e293b;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%; max-width: 420px;
        background: #fff;
        border: 1px solid #dbeafe;
        border-radius: 22px;
        padding: 40px 36px;
        box-shadow: 0 20px 50px rgba(30, 64, 175, 0.12);
      }

      .logo-hdr { text-align: center; margin-bottom: 24px; }
      .brand-icon {
        width: 68px; height: 68px;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        border-radius: 20px; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; color: #fff;
        box-shadow: 0 10px 24px rgba(59, 130, 246, 0.35);
      }
      .logo-hdr h1 { font-size: 21px; font-weight: 800; color: #1e293b; }
      .logo-hdr p { font-size: 13px; color: #64748b; margin-top: 4px; }

      .badge {
        display: inline-block; background: #eff6ff; border: 1px solid #bfdbfe;
        color: #1d4ed8; padding: 4px 12px; border-radius: 20px; font-size: 11px;
        font-weight: 700; text-transform: uppercase; margin-bottom: 16px;
      }

      .field-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 8px; letter-spacing: 0.5px; }
      .field-input {
        width: 100%; padding: 14px 16px;
        background: #f8fafc; border: 1.5px solid #e2e8f0;
        border-radius: 11px; color: #1e293b; font-size: 20px; outline: none; transition: 0.2s; margin-bottom: 18px;
        text-align: center; letter-spacing: 6px; font-weight: 800;
      }
      .field-input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

      .btn-primary {
        width: 100%; padding: 14px; border: none; border-radius: 11px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      }
      .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(37, 99, 235, 0.45); }

      .error-box {
        background: #fee2e2; border: 1px solid #fca5a5;
        color: #dc2626; border-radius: 10px; padding: 12px 16px; font-size: 13px; font-weight: 600; margin-bottom: 20px;
        display: flex; align-items: center; gap: 8px;
      }

      .footer-link { margin-top: 22px; text-align: center; font-size: 13px; }
      .footer-link a { color: #64748b; text-decoration: none; }
      .footer-link a:hover { color: #3b82f6; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-hdr">
        <div class="brand-icon"><i class="ti ti-mail-check"></i></div>
        <h1>Check Your Email</h1>
        {% if username %}<p>Signed in as <strong>{{ username }}</strong></p>{% endif %}
      </div>

      {% if error %}
      <div class="error-box"><i class="ti ti-alert-circle"></i> {{ error }}</div>
      {% endif %}

      {% if username %}
      <div style="text-align: center;">
        <span class="badge">Verification code</span>
        <p style="font-size: 13px; color: #64748b; margin: 6px 0 18px;">We emailed a 6-digit code to the address on file for this account. Enter it below — it expires in 5 minutes.</p>
      </div>

      <form action="{{ tpath('/mfa_verify') }}" method="POST">
        <input class="field-input" type="text" name="otp_code" placeholder="000000" required autofocus maxlength="6" inputmode="numeric" pattern="[0-9]{6}" />
        <button type="submit" class="btn-primary">Verify &amp; Continue</button>
      </form>
      {% endif %}

      <div class="footer-link">
        <a href="{{ tpath('/login') }}">← Start over</a>
      </div>
    </div>
  </body>
</html>
