<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Portal — Sign In</title>
    <link rel="stylesheet" href="/static/shared.min.css" />
    <link rel="stylesheet" href="/static/tabler-icons.min.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
      body {
        min-height: 100vh;
        background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%);
        color: #1e293b;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%; max-width: 420px;
        background: #fff;
        border: 1px solid #dbeafe;
        border-radius: 22px;
        padding: 40px 36px;
        box-shadow: 0 20px 50px rgba(30, 64, 175, 0.12);
      }

      .logo-hdr { text-align: center; margin-bottom: 28px; }
      .brand-icon {
        width: 68px; height: 68px;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        border-radius: 20px; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; color: #fff;
        box-shadow: 0 10px 24px rgba(59, 130, 246, 0.35);
      }
      .logo-hdr h1 { font-size: 21px; font-weight: 800; color: #1e293b; }
      .logo-hdr p { font-size: 13px; color: #64748b; margin-top: 4px; }

      .field-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 8px; letter-spacing: 0.5px; }
      .field-input {
        width: 100%; padding: 13px 15px;
        background: #f8fafc; border: 1.5px solid #e2e8f0;
        border-radius: 11px; color: #1e293b; font-size: 15px; outline: none; transition: 0.2s; margin-bottom: 18px;
      }
      .field-input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

      .btn-primary {
        width: 100%; padding: 14px; border: none; border-radius: 11px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      }
      .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(37, 99, 235, 0.45); }

      .error-box {
        background: #fee2e2; border: 1px solid #fca5a5;
        color: #dc2626; border-radius: 10px; padding: 12px 16px; font-size: 13px; font-weight: 600; margin-bottom: 20px;
      }

      .footer-link { margin-top: 22px; text-align: center; font-size: 13px; }
      .footer-link a { color: #64748b; text-decoration: none; }
      .footer-link a:hover { color: #3b82f6; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-hdr">
        <div class="brand-icon"><i class="ti ti-users"></i></div>
        <h1>HR Portal</h1>
        <p>{{ co.company_name if co else 'Employee Attendance System' }}</p>
      </div>

      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form action="/hr_login" method="POST">
        <label class="field-label">HR Username</label>
        <input class="field-input" type="text" name="identifier" placeholder="Enter HR username" required autofocus />

        <label class="field-label">Password</label>
        <input class="field-input" type="password" name="password" placeholder="Enter password" required />

        {% if show_captcha %}
        <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" style="margin-bottom:20px;"></div>
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
        {% endif %}

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="footer-link">
        <a href="/admin_login">← Return to Standard Login</a>
      </div>
    </div>
  </body>
</html>
